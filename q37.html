<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATM PIN Entry</title>
  <link rel="stylesheet" href="q37.css">
</head>
<body>
  <div class="card atm">
    <h1>ATM - Enter PIN</h1>
    <input type="password" id="pin" maxlength="4" placeholder="••••" autocomplete="off" inputmode="numeric">
    <p id="status">&nbsp;</p>
    <p class="hint">Digits only. Press Enter to submit.</p>
  </div>
  <script src="q37.js"></script>
</body>
</html>
