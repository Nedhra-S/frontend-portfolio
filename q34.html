<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Product Card</title>
  <link rel="stylesheet" href="q34.css">
</head>
<body>
  <div class="card">
    <div class="product">
      <div class="img-wrap" id="wrap"><img src="../assets/img/headphones.svg" alt="Wireless Headphones" id="img"></div>
      <div class="extra" id="extra">Bluetooth 5.3 &bull; 40-hour battery &bull; Noise cancelling</div>
      <div class="body">
        <h2>Wireless Headphones</h2>
        <button id="view">View Details</button>
        <p id="details"></p>
      </div>
    </div>
  </div>
  <script src="q34.js"></script>
</body>
</html>
