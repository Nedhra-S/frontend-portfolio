<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Portal</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .title { background: #1c3d7a; color: #fff; padding: 14px 20px; font-size: 24px; font-weight: bold; }
    .layout { display: flex; min-height: 320px; }
    .sidebar { width: 200px; background: #eef2ff; border-right: 1px solid #c7d2fe; }
    .menu-item { padding: 14px 20px; border-bottom: 1px solid #c7d2fe; cursor: pointer; }
    .menu-item:hover { background: #1c3d7a; color: #fff; }
    .content { flex: 1; padding: 30px; font-size: 20px; }
  </style>
</head>
<body>
  <div class="title">Student Portal</div>

  <div class="layout">
    <div class="sidebar">
      <div class="menu-item">Dashboard</div>
      <div class="menu-item">Profile</div>
      <div class="menu-item">Attendance</div>
      <div class="menu-item">Marks</div>
      <div class="menu-item">Settings</div>
    </div>
    <div class="content">Welcome to the VIT Student Portal Dashboard</div>
  </div>
</body>
</html>
