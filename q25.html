<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patient Registration Form</title>
  <link rel="stylesheet" href="q25.css">
</head>
<body>
  <form class="form" action="#" method="post" enctype="multipart/form-data">
    <h1>Patient Registration</h1>
    <input type="hidden" name="patient_id" value="PT-2026-0001">

    <div class="grid">
      <label>Patient Name <input type="text" name="name" placeholder="Full name" required></label>
      <label>Email Address <input type="email" name="email" placeholder="name@example.com" required></label>
      <label>Password <input type="password" name="password" placeholder="Min 8 characters" minlength="8" required></label>
      <label>Contact Number <input type="tel" name="phone" placeholder="10-digit number" pattern="[0-9]{10}" required></label>
      <label>Age <input type="number" name="age" min="0" max="120" placeholder="Age" required></label>
      <label>Date of Birth <input type="date" name="dob" required></label>
      <label>Appointment Time <input type="time" name="atime" required></label>
      <label>Appointment Date &amp; Time <input type="datetime-local" name="adatetime" required></label>
      <label>Personal Website / Reference <input type="url" name="site" placeholder="https://example.com"></label>
      <label>Search Doctor <input type="search" name="doctor" placeholder="Search doctor or department"></label>
      <label>Consultation Colour Theme <input type="color" name="theme" value="#0d9488"></label>
      <label>Medical Record Upload <input type="file" name="record" accept=".pdf,image/*"></label>
      <label class="full">Pain Level <input type="range" name="pain" min="0" max="10" value="3" oninput="painOut.value=this.value"> <output id="painOut">3</output> / 10</label>
      <label>Blood Group
        <select name="blood" required>
          <option value="">-- Select --</option>
          <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
        </select>
      </label>

      <fieldset>
        <legend>Gender</legend>
        <label class="inline"><input type="radio" name="gender" value="Male" required> Male</label>
        <label class="inline"><input type="radio" name="gender" value="Female"> Female</label>
        <label class="inline"><input type="radio" name="gender" value="Other"> Other</label>
      </fieldset>

      <fieldset class="full">
        <legend>Known Allergies</legend>
        <label class="inline"><input type="checkbox" name="allergy" value="Dust"> Dust</label>
        <label class="inline"><input type="checkbox" name="allergy" value="Pollen"> Pollen</label>
        <label class="inline"><input type="checkbox" name="allergy" value="Penicillin"> Penicillin</label>
        <label class="inline"><input type="checkbox" name="allergy" value="Peanuts"> Peanuts</label>
      </fieldset>

      <label class="full">Address <textarea name="address" rows="3" placeholder="Street, city, state, PIN" required></textarea></label>
    </div>

    <div class="buttons">
      <input type="submit" value="Submit">
      <input type="reset" value="Reset" class="alt">
      <input type="image" src="../assets/img/pay.svg" alt="Pay online" width="110" height="40" title="Online payment / confirmation">
    </div>
  </form>
</body>
</html>
