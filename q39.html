<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Exam Question</title>
  <link rel="stylesheet" href="q39.css">
</head>
<body>
  <div class="card">
    <h1>Online Exam</h1>
    <p class="q">Q1. Which HTML tag is used to create a hyperlink?</p>
    <div id="options">
      <div class="option" data-value="A">A. &lt;link&gt;</div>
      <div class="option" data-value="B">B. &lt;a&gt;</div>
      <div class="option" data-value="C">C. &lt;href&gt;</div>
      <div class="option" data-value="D">D. &lt;url&gt;</div>
    </div>
    <button id="submit">Submit Answer</button>
    <p class="hint">Click an option, then press Enter or click Submit.</p>
    <p id="msg"></p>
  </div>
  <script src="q39.js"></script>
</body>
</html>
