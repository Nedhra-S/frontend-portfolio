<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Search - Keyboard Events</title>
  <link rel="stylesheet" href="q36.css">
</head>
<body>
  <div class="card">
    <h1>Student Search</h1>
    <input type="text" id="search" placeholder="Type a student name..." autocomplete="off">
    <p>Key pressed: <b id="key">-</b></p>
    <p class="out" id="status"></p>
    <p class="hint">Enter = search &bull; Esc = clear</p>
  </div>
  <script src="q36.js"></script>
</body>
</html>
