<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library Management System</title>
</head>
<body style="margin:0; font-family:Arial, sans-serif; background:#f3f4f6;">

  <div style="background:#1f2937; color:#fff; text-align:center; padding:18px; font-size:28px; font-weight:bold;">
    Library Management System
  </div>

  <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:700px; margin:30px auto; padding:0 16px;">

    <div style="background:#3b5bdb; color:#fff; text-align:center; padding:24px; border-radius:12px;">
      <img src="../assets/img/lib-books.svg" alt="Books" width="110" style="border-radius:16px;">
      <h2 style="margin:12px 0 0;">Books</h2>
    </div>

    <div style="background:#e8590c; color:#fff; text-align:center; padding:24px; border-radius:12px;">
      <img src="../assets/img/lib-members.svg" alt="Members" width="110" style="border-radius:16px;">
      <h2 style="margin:12px 0 0;">Members</h2>
    </div>

    <div style="background:#2f9e44; color:#fff; text-align:center; padding:24px; border-radius:12px;">
      <img src="../assets/img/lib-issue.svg" alt="Issue Books" width="110" style="border-radius:16px;">
      <h2 style="margin:12px 0 0;">Issue Books</h2>
    </div>

    <div style="background:#9c36b5; color:#fff; text-align:center; padding:24px; border-radius:12px;">
      <img src="../assets/img/lib-digital.svg" alt="Digital Library" width="110" style="border-radius:16px;">
      <h2 style="margin:12px 0 0;">Digital Library</h2>
    </div>

  </div>
</body>
</html>
