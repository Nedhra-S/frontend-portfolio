<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LearnSphere Academy</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 32px; background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,.1); flex-wrap: wrap; gap: 12px; }
    .logo { font-size: 24px; font-weight: 800; color: #6d28d9; }
    .logo span { color: #f97316; }
    .menu { display: flex; gap: 22px; }
    .menu a { text-decoration: none; color: #374151; font-weight: 500; padding: 6px 0; border-bottom: 2px solid transparent; }
    .menu a:hover { color: #6d28d9; border-color: #6d28d9; }
    .enroll { background: #6d28d9; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; }
    .enroll:hover { background: #5b21b6; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">Learn<span>Sphere</span> Academy</div>
    <nav class="menu">
      <a href="#">Home</a>
      <a href="#">Courses</a>
      <a href="#">Instructors</a>
      <a href="#">Resources</a>
      <a href="#">Contact</a>
    </nav>
    <a class="enroll" href="#">Enroll Now</a>
  </header>
</body>
</html>
