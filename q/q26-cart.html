<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - Part C</title>
  <link rel="stylesheet" href="q26.css">
</head>
<body>
  <div class="box">
    <h1>Checkout</h1>
    <ol class="steps">
      <li class=""><a href="q26.html">A. Customer &amp; Delivery</a></li>
      <li class=""><a href="q26-payment.html">B. Payment</a></li>
      <li class="on"><a href="q26-cart.html">C. Cart Summary</a></li>
    </ol>
    <h2>Part C - Cart Summary</h2>
    <table id="cart">
      <thead><tr><th>Product Name</th><th>Quantity</th><th>Price</th><th>Subtotal</th></tr></thead>
      <tbody>
        <tr><td>Wireless Headphones</td><td>1</td><td data-price="2499">&#8377;2,499</td><td class="sub"></td></tr>
        <tr><td>USB-C Cable</td><td>2</td><td data-price="299">&#8377;299</td><td class="sub"></td></tr>
        <tr><td>Notebook (Pack of 3)</td><td>1</td><td data-price="350">&#8377;350</td><td class="sub"></td></tr>
      </tbody>
      <tfoot><tr><th colspan="3">Total Amount</th><th id="total"></th></tr></tfoot>
    </table>
    <div class="buttons">
      <button type="button" id="place">Place Order</button>
      <a class="btn alt" href="q26.html" id="cancel">Cancel</a>
    </div>
    <p id="msg" role="status"></p>
    <script src="q26.js"></script>
  </div>
</body>
</html>
