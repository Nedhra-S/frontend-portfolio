<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Login - Validation</title>
  <link rel="stylesheet" href="q28.css">
</head>
<body>
  <div class="card">
    <h1>Student Login</h1>
    <form id="login" novalidate>
      <label>Username or Email Address
        <input type="text" id="username" placeholder="Enter username or email">
        <span class="err-text" id="uErr"></span>
      </label>
      <label>Password
        <input type="password" id="password" placeholder="Enter password">
        <span class="err-text" id="pErr"></span>
      </label>
      <fieldset>
        <legend>User Role</legend>
        <label class="inline"><input type="radio" name="role" value="Student" checked> Student</label>
        <label class="inline"><input type="radio" name="role" value="Faculty"> Faculty</label>
      </fieldset>
      <label class="inline"><input type="checkbox" id="remember"> Remember Me</label>
      <button type="submit">Login</button>
      <button type="reset" class="alt">Clear</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
  <script src="q28.js"></script>
</body>
</html>
