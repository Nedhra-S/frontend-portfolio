<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Card</title>
  <style>
    .card {
      width: 280px;
      margin: 40px auto;
      padding: 20px;
      border: 2px solid #333;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    .card img { border-radius: 50%; border: 3px solid #333; }
  </style>
</head>
<body>
  <div class="card">
    <img src="../assets/img/avatar.svg" alt="Profile image" width="140" height="140">
    <h2>Nedhra S</h2>
    <p>Department: Computer Science and Engineering</p>
    <p>College: Vellore Institute of Technology (VIT)</p>
  </div>
</body>
</html>
