<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Traffic Signal</title>
  <link rel="stylesheet" href="q35.css">
</head>
<body>
  <div class="card">
    <h1>Traffic Signal</h1>
    <div class="light-box">
      <div class="light red" data-msg="STOP" data-color="#ef4444"></div>
      <div class="light yellow" data-msg="READY" data-color="#ca8a04"></div>
      <div class="light green" data-msg="GO" data-color="#16a34a"></div>
    </div>
    <p id="message">&nbsp;</p>
    <p class="hint">Move the mouse over a light</p>
  </div>
  <script src="q35.js"></script>
</body>
</html>
