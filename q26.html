<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - Part A</title>
  <link rel="stylesheet" href="q26.css">
</head>
<body>
  <div class="box">
    <h1>Checkout</h1>
    <ol class="steps">
      <li class="on"><a href="q26.html">A. Customer &amp; Delivery</a></li>
      <li class=""><a href="q26-payment.html">B. Payment</a></li>
      <li class=""><a href="q26-cart.html">C. Cart Summary</a></li>
    </ol>
    <h2>Part A - Customer &amp; Delivery Details</h2>
    <form action="q26-payment.html" method="get">
      <label>Customer Name <input type="text" name="name" placeholder="Full name" required></label>
      <label>Email Address <input type="email" name="email" placeholder="name@example.com" required></label>
      <label>Mobile Number <input type="tel" name="mobile" placeholder="10-digit number" pattern="[0-9]{10}" required></label>
      <label>Delivery Address <textarea name="address" rows="3" placeholder="House no., street, area" required></textarea></label>
      <label>City <input type="text" name="city" placeholder="City" required></label>
      <label>State
        <select name="state" required>
          <option value="">-- Select State --</option>
          <option>Tamil Nadu</option><option>Kerala</option><option>Karnataka</option><option>Andhra Pradesh</option>
          <option>Telangana</option><option>Maharashtra</option><option>Delhi</option><option>West Bengal</option>
        </select>
      </label>
      <label>PIN Code <input type="number" name="pin" placeholder="6-digit PIN" min="100000" max="999999" required></label>
      <label>Delivery Date <input type="date" name="ddate" required></label>
      <div class="buttons"><button type="submit">Continue to Payment &rarr;</button></div>
    </form>
  </div>
</body>
</html>
